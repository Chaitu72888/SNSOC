name: Deploy Test Reports to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-reports-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package All Test Reports
        run: |
          mkdir -p packaged_reports
          cp appium-tests/*.xlsx packaged_reports/ 2>/dev/null || true
          cp selenium-tests/*.xlsx packaged_reports/ 2>/dev/null || true
          cp baseline_load_tests/reports/*.xlsx packaged_reports/ 2>/dev/null || true

      - name: Upload Packaged Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Package
          path: packaged_reports/
          retention-days: 30

      - name: Publish Step Summary
        run: |
          echo "# Test Reports Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Excel test reports packaged and uploaded to artifacts." >> $GITHUB_STEP_SUMMARY
