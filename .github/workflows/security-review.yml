name: 🔐 SNSOC — Automated Security Review

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_dast:
        description: 'Run DAST against live URL'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Technology Detection
  # ─────────────────────────────────────────────────────────────────────────────
  detect-stack:
    name: 🔍 Detect Technology Stack
    runs-on: ubuntu-latest
    outputs:
      is_python: ${{ steps.detect.outputs.is_python }}
      framework:  ${{ steps.detect.outputs.framework }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Backend Framework
        id: detect
        run: |
          IS_PYTHON=false
          FRAMEWORK="unknown"

          if [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            IS_PYTHON=true
            if grep -qi "flask" requirements.txt 2>/dev/null; then
              FRAMEWORK="Flask"
            elif grep -qi "django" requirements.txt 2>/dev/null; then
              FRAMEWORK="Django"
            elif grep -qi "fastapi" requirements.txt 2>/dev/null; then
              FRAMEWORK="FastAPI"
            fi
          fi

          echo "is_python=$IS_PYTHON" >> $GITHUB_OUTPUT
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT

          echo "### 🔍 Technology Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Project | $IS_PYTHON |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | $FRAMEWORK |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Secret & Credential Scanning (Gitleaks)
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Manual Secret Pattern Check
        run: |
          echo "## 🔑 Secret Pattern Scan Results" >> $GITHUB_STEP_SUMMARY

          FOUND_ISSUES=0

          # Check for hardcoded passwords in Python files
          if grep -rn "hashpw\|bcrypt\|password\s*=" --include="*.py" . | grep -v "environ\|os.get\|test\|#" | grep -v ".venv" | grep -v "node_modules" | head -20; then
            echo "⚠️ Potential hardcoded password patterns found" >> $GITHUB_STEP_SUMMARY
            FOUND_ISSUES=$((FOUND_ISSUES+1))
          fi

          # Check for API keys
          if grep -rn "API_KEY\s*=\s*['\"][a-zA-Z0-9]\{20,\}" --include="*.py" . | grep -v "environ\|os.get\|#" | grep -v ".venv" | head -10; then
            echo "⚠️ Potential hardcoded API keys found" >> $GITHUB_STEP_SUMMARY
            FOUND_ISSUES=$((FOUND_ISSUES+1))
          fi

          # Check for .env file committed to git
          if git log --all --full-history -- .env | grep -q "commit"; then
            echo "🔴 CRITICAL: .env file found in git history!" >> $GITHUB_STEP_SUMMARY
            FOUND_ISSUES=$((FOUND_ISSUES+1))
          fi

          # Check for default/weak SECRET_KEY
          if grep -rn "secret.key\|SECRET_KEY" --include="*.py" . | grep -v "environ\|os.get\|#\|test" | grep -v ".venv" | head -5; then
            echo "⚠️ Potential hardcoded SECRET_KEY found" >> $GITHUB_STEP_SUMMARY
            FOUND_ISSUES=$((FOUND_ISSUES+1))
          fi

          if [ "$FOUND_ISSUES" -gt 0 ]; then
            echo "| Total Issues | $FOUND_ISSUES |" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No secret patterns found in source code" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: SAST — Python / Flask Specific
  # ─────────────────────────────────────────────────────────────────────────────
  sast-python:
    name: 🔬 SAST — Python Security Analysis
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.is_python == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SAST Tools
        run: |
          pip install bandit safety pip-audit semgrep 2>/dev/null || true
          pip install bandit safety pip-audit 2>/dev/null || true

      - name: Run Bandit (Python SAST)
        run: |
          mkdir -p security-reports
          bandit -r . \
            --exclude ./venv,./.venv,./node_modules,./selenium-tests,./appium-tests \
            -f json -o security-reports/bandit-report.json \
            --severity-level medium 2>/dev/null || true

          bandit -r . \
            --exclude ./venv,./.venv,./node_modules,./selenium-tests,./appium-tests \
            -f txt 2>/dev/null | head -100 || echo "Bandit scan completed"

          echo "## 🔬 Bandit SAST Results" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/bandit-report.json ]; then
            ISSUES=$(python3 -c "import json; d=json.load(open('security-reports/bandit-report.json')); r=d.get('results',[]); print(f'High: {sum(1 for x in r if x[\"issue_severity\"]==\"HIGH\")}, Medium: {sum(1 for x in r if x[\"issue_severity\"]==\"MEDIUM\")}, Low: {sum(1 for x in r if x[\"issue_severity\"]==\"LOW\")}')" 2>/dev/null || echo "Parse error")
            echo "| Severity Breakdown | $ISSUES |" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Run Safety (Known CVE Check)
        run: |
          safety check -r requirements.txt --json > security-reports/safety-report.json 2>/dev/null || \
          safety check -r requirements.txt > security-reports/safety-report.txt 2>/dev/null || \
          echo "Safety check completed (may require API key for full scan)"

          echo "## 🛡️ Safety CVE Check" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/safety-report.txt ]; then
            cat security-reports/safety-report.txt | head -30 >> $GITHUB_STEP_SUMMARY || true
          fi
        continue-on-error: true

      - name: Run pip-audit (Dependency CVE)
        run: |
          pip-audit -r requirements.txt \
            --format json \
            --output security-reports/pip-audit-report.json 2>/dev/null || \
          pip-audit -r requirements.txt 2>/dev/null || \
          echo "pip-audit completed"

          echo "## 📦 pip-audit Dependency CVEs" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/pip-audit-report.json ]; then
            VULN_COUNT=$(python3 -c "import json; d=json.load(open('security-reports/pip-audit-report.json')); print(len(d.get('dependencies',[])))" 2>/dev/null || echo "0")
            echo "| Vulnerable Packages | $VULN_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Custom Flask Security Checks
        run: |
          echo "## 🐍 Flask-Specific Security Checks" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check 1: Missing @login_required
          UNPROTECTED=$(grep -rn "^@.*\.route" --include="*.py" api/ 2>/dev/null | grep -v "test" | wc -l)
          PROTECTED=$(grep -rn "@login_required" --include="*.py" api/ 2>/dev/null | wc -l)
          echo "| Auth Decorator Coverage | ⚠️ Check | Routes: $UNPROTECTED, Protected: $PROTECTED |" >> $GITHUB_STEP_SUMMARY

          # Check 2: shell=True in subprocess calls
          SHELL_TRUE=$(grep -rn "shell=True" --include="*.py" . | grep -v "venv\|test\|#" | wc -l)
          if [ "$SHELL_TRUE" -gt 0 ]; then
            echo "| subprocess shell=True | 🔴 FOUND | $SHELL_TRUE occurrence(s) — Command Injection Risk! |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| subprocess shell=True | ✅ Clean | No unsafe shell execution found |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check 3: Wildcard CORS
          WILDCARD_CORS=$(grep -rn "cors_allowed_origins.*\*\|Allow-Origin.*\*" --include="*.py" . | grep -v "venv\|test\|#" | wc -l)
          if [ "$WILDCARD_CORS" -gt 0 ]; then
            echo "| Wildcard CORS | 🔴 FOUND | Access-Control-Allow-Origin: * detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Wildcard CORS | ✅ Clean | CORS properly restricted |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check 4: SECRET_KEY hardcoded fallback
          WEAK_SK=$(grep -rn "SECRET_KEY.*=.*['\"].*['\"]" --include="*.py" . | grep -v "environ\|os.get\|#\|venv" | wc -l)
          if [ "$WEAK_SK" -gt 0 ]; then
            echo "| SECRET_KEY Hardcoded | 🔴 FOUND | Non-environment-variable SECRET_KEY detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| SECRET_KEY | ✅ Clean | SECRET_KEY from environment variable |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check 5: Flask Debug Mode
          DEBUG_ON=$(grep -rn "debug\s*=\s*True\|DEBUG\s*=\s*True" --include="*.py" . | grep -v "venv\|test\|#" | wc -l)
          if [ "$DEBUG_ON" -gt 0 ]; then
            echo "| Flask Debug Mode | 🔴 FOUND | Debug mode enabled — disable in production! |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Flask Debug Mode | ✅ Clean | No debug mode detected |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check 6: Input Validation on IP
          IP_VALIDATE=$(grep -rn "ip_address\|ipaddress\|validate.*ip\|ip.*validate" --include="*.py" . | grep -v "venv\|test\|#" | wc -l)
          if [ "$IP_VALIDATE" -eq 0 ]; then
            echo "| IP Input Validation | 🔴 MISSING | No IP format validation found — injection risk! |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| IP Input Validation | ✅ Present | IP validation logic found |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check 7: Security Headers
          SEC_HDR=$(grep -rn "X-Frame-Options\|Content-Security-Policy\|flask.talisman\|flask_talisman" --include="*.py" . | grep -v "venv\|test\|#" | wc -l)
          if [ "$SEC_HDR" -eq 0 ]; then
            echo "| Security Headers | 🔴 MISSING | No CSP/X-Frame-Options/HSTS configured |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Headers | ✅ Present | Security headers configured |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check 8: Rate Limiting Applied
          RATE_APPLIED=$(grep -rn "@limiter\|@.*limit\b" --include="*.py" . | grep -v "venv\|test\|#\|import\|def " | wc -l)
          if [ "$RATE_APPLIED" -eq 0 ]; then
            echo "| Rate Limiting | 🔴 MISSING | Flask-Limiter not applied to any route |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Rate Limiting | ✅ Applied | Rate limiting decorators found |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SAST-Security-Reports
          path: security-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Dependency Vulnerability Scan
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.is_python == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Audit Python Dependencies
        run: |
          mkdir -p dep-reports
          pip install pip-audit 2>/dev/null || true

          echo "## 📦 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Risk | Note |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|------|" >> $GITHUB_STEP_SUMMARY

          # Check for known risky packages
          while IFS= read -r line; do
            PKG=$(echo "$line" | sed 's/[>=<].*//' | tr '[:upper:]' '[:lower:]' | xargs)
            case "$PKG" in
              scapy)
                echo "| scapy | 🔴 HIGH | Requires root privileges for raw sockets. Not functional on Render.com free tier. Remove if mock capture is used. |" >> $GITHUB_STEP_SUMMARY
                ;;
              scikit-learn|sklearn)
                echo "| scikit-learn | 🟡 MEDIUM | Large ML library unused in runtime code. Increases attack surface and build time. |" >> $GITHUB_STEP_SUMMARY
                ;;
              pandas)
                echo "| pandas | 🟡 MEDIUM | Heavy library unused in runtime code. Remove or move to dev dependencies. |" >> $GITHUB_STEP_SUMMARY
                ;;
              geoip2)
                echo "| geoip2 | 🟡 MEDIUM | Requires MaxMind .mmdb database file not present in repo. Silent failures possible. |" >> $GITHUB_STEP_SUMMARY
                ;;
              flask-limiter)
                echo "| flask-limiter | ⚠️ CONFIG | Installed but not initialized with app or applied to login endpoint. |" >> $GITHUB_STEP_SUMMARY
                ;;
              *)
                echo "| $PKG | ✅ OK | No known issues |" >> $GITHUB_STEP_SUMMARY
                ;;
            esac
          done < requirements.txt

          # Run pip-audit
          pip-audit -r requirements.txt 2>/dev/null > dep-reports/pip-audit.txt || echo "pip-audit completed with findings"
          cat dep-reports/pip-audit.txt | head -50 || true

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dependency-Scan-Reports
          path: dep-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: API Security Check (DAST — Live Endpoint)
  # ─────────────────────────────────────────────────────────────────────────────
  api-security-check:
    name: 🌐 API Security Check (Live DAST)
    runs-on: ubuntu-latest
    needs: detect-stack
    env:
      TARGET_URL: https://snsoc-4.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Install API Testing Tools
        run: |
          pip install httpx requests 2>/dev/null || true
          sudo apt-get install -y curl jq 2>/dev/null || true

      - name: DAST — Authentication Tests
        run: |
          echo "## 🌐 DAST — API Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** $TARGET_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Endpoint | Result | Severity |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|--------|----------|" >> $GITHUB_STEP_SUMMARY

          # Test 1: Unauthenticated access to protected endpoint
          RESP=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/api/dashboard" --max-time 15 2>/dev/null || echo "000")
          if [ "$RESP" = "200" ]; then
            echo "| Auth Bypass Test | /api/dashboard | 🔴 FAIL — 200 without auth! | CRITICAL |" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESP" = "302" ] || [ "$RESP" = "401" ] || [ "$RESP" = "403" ]; then
            echo "| Auth Bypass Test | /api/dashboard | ✅ PASS — $RESP redirects to login | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Auth Bypass Test | /api/dashboard | ⚠️ $RESP (connection issue or cold start) | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # Test 2: Unauthenticated access to intel/lookup (should require auth but currently doesn't)
          RESP2=$(curl -s -o /tmp/intel_resp.json -w "%{http_code}" \
            -X POST "$TARGET_URL/api/intel/lookup" \
            -H "Content-Type: application/json" \
            -d '{"ip":"8.8.8.8"}' \
            --max-time 15 2>/dev/null || echo "000")
          if [ "$RESP2" = "200" ]; then
            echo "| Missing Auth | /api/intel/lookup | 🔴 FAIL — 200 without auth (KNOWN ISSUE F004) | HIGH |" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESP2" = "302" ] || [ "$RESP2" = "401" ]; then
            echo "| Missing Auth | /api/intel/lookup | ✅ PASS — $RESP2 (auth required) | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Missing Auth | /api/intel/lookup | ⚠️ $RESP2 | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # Test 3: Unauthenticated telemetry access
          RESP3=$(curl -s -o /dev/null -w "%{http_code}" \
            "$TARGET_URL/api/telemetry/consumption" \
            --max-time 15 2>/dev/null || echo "000")
          if [ "$RESP3" = "200" ]; then
            echo "| Missing Auth | /api/telemetry/consumption | 🔴 FAIL — 200 without auth (KNOWN ISSUE F004) | HIGH |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Missing Auth | /api/telemetry/consumption | ✅ PASS — $RESP3 | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # Test 4: Check CORS headers
          CORS=$(curl -s -I "$TARGET_URL/api/telemetry/consumption" --max-time 15 2>/dev/null | grep -i "access-control-allow-origin" || echo "not found")
          if echo "$CORS" | grep -q "\*"; then
            echo "| Wildcard CORS | All Endpoints | 🔴 FAIL — Access-Control-Allow-Origin: * detected | HIGH |" >> $GITHUB_STEP_SUMMARY
          elif echo "$CORS" | grep -q "access-control"; then
            echo "| CORS Config | All Endpoints | ⚠️ CORS header present but not wildcard — review origin | MEDIUM |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| CORS Config | All Endpoints | ℹ️ No CORS headers detected or endpoint offline | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # Test 5: Security headers check
          HEADERS=$(curl -s -I "$TARGET_URL/auth/login" --max-time 15 2>/dev/null)
          CSP=$(echo "$HEADERS" | grep -i "content-security-policy" || echo "")
          XFRAME=$(echo "$HEADERS" | grep -i "x-frame-options" || echo "")
          HSTS=$(echo "$HEADERS" | grep -i "strict-transport-security" || echo "")

          [ -z "$CSP" ]   && echo "| Missing CSP | All Endpoints | 🔴 FAIL — No Content-Security-Policy header | HIGH |" >> $GITHUB_STEP_SUMMARY || echo "| CSP Present | All Endpoints | ✅ PASS | - |" >> $GITHUB_STEP_SUMMARY
          [ -z "$XFRAME" ] && echo "| Missing X-Frame-Options | All Endpoints | 🟠 FAIL — Clickjacking possible | MEDIUM |" >> $GITHUB_STEP_SUMMARY || echo "| X-Frame-Options | All Endpoints | ✅ PASS | - |" >> $GITHUB_STEP_SUMMARY
          [ -z "$HSTS" ]  && echo "| Missing HSTS | All Endpoints | 🟡 FAIL — No Strict-Transport-Security | MEDIUM |" >> $GITHUB_STEP_SUMMARY || echo "| HSTS Present | All Endpoints | ✅ PASS | - |" >> $GITHUB_STEP_SUMMARY

          # Test 6: Rate limiting on login
          echo "Testing login rate limiting (10 rapid requests)..."
          RATE_HIT=false
          for i in $(seq 1 10); do
            RCODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$TARGET_URL/auth/login" \
              -d "username=testuser&password=wrongpassword" \
              --max-time 5 2>/dev/null || echo "000")
            if [ "$RCODE" = "429" ]; then
              RATE_HIT=true
              break
            fi
          done
          if $RATE_HIT; then
            echo "| Rate Limiting | /auth/login | ✅ PASS — 429 returned after repeated attempts | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Rate Limiting | /auth/login | 🔴 FAIL — No 429 after 10 rapid login attempts (F008) | HIGH |" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Generate & Upload Full Security Report Artifact
  # ─────────────────────────────────────────────────────────────────────────────
  generate-report:
    name: 📋 Generate Security Report Artifact
    runs-on: ubuntu-latest
    needs: [sast-python, dependency-scan, api-security-check]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Report Generator Dependencies
        run: pip install openpyxl

      - name: Run Excel Report Generator
        run: |
          cd "Vulnerability Test Results"
          python generate_security_excel.py || echo "Excel generation completed"
        continue-on-error: true

      - name: Package All Security Reports
        run: |
          mkdir -p final-security-report
          cp "Vulnerability Test Results/security-review.md"   final-security-report/ 2>/dev/null || true
          cp "Vulnerability Test Results/executive-summary.md" final-security-report/ 2>/dev/null || true
          cp "Vulnerability Test Results/dependency-report.md" final-security-report/ 2>/dev/null || true
          cp "Vulnerability Test Results/findings.xlsx"         final-security-report/ 2>/dev/null || true
          cp "Vulnerability Test Results/endpoint-inventory.xlsx" final-security-report/ 2>/dev/null || true

          # Generate final summary markdown
          cat > final-security-report/SECURITY-SUMMARY.md << 'SUMMARY'
          # SNSOC Security Assessment — GitHub Actions Report

          ## Scan Configuration
          - **Target**: SNSOC Flask Backend
          - **Scan Types**: SAST (Bandit, Semgrep, Custom), Dependency Audit (pip-audit, Safety), DAST (Live API)
          - **Framework**: Flask 3.x (Python 3.10)

          ## Quick Score Card
          | Metric | Value |
          |--------|-------|
          | Overall Score | 42 / 100 |
          | Risk Level | HIGH |
          | Critical Findings | 3 |
          | High Findings | 5 |
          | Medium Findings | 5 |
          | Low Findings | 2 |
          | Total Endpoints | 18 |
          | Unauthenticated Endpoints | 5 |

          ## Top Immediate Actions
          1. 🔴 Rotate AbuseIPDB API key (exposed in .env)
          2. 🔴 Set strong random SECRET_KEY via environment variable
          3. 🔴 Fix command injection in firewall/iptables.py and firewall/netsh.py
          4. 🔴 Add @login_required to 5 unauthenticated API endpoints
          5. 🔴 Apply Flask-Limiter rate limit to /auth/login

          ## Files in This Artifact
          - `security-review.md` — Full SAST findings with exploitation scenarios
          - `executive-summary.md` — Executive-level risk summary
          - `dependency-report.md` — Dependency vulnerability analysis
          - `findings.xlsx` — Color-coded Excel workbook (4 sheets)
          - `endpoint-inventory.xlsx` — Complete API inventory spreadsheet
          SUMMARY

          echo "## 📋 Security Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "All security reports have been packaged and uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          ls -lh final-security-report/

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNSOC-Security-Assessment-Reports
          path: final-security-report/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7: Security Gate — Fail on Critical Findings
  # ─────────────────────────────────────────────────────────────────────────────
  security-gate:
    name: 🚦 Security Gate (Fail on Critical)
    runs-on: ubuntu-latest
    needs: [sast-python, dependency-scan, api-security-check]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate Critical Security Violations
        run: |
          CRITICAL_VIOLATIONS=0
          VIOLATION_DETAILS=""

          # Check 1: shell=True with user input (command injection)
          if grep -rn "shell=True" --include="*.py" firewall/ 2>/dev/null | grep -q .; then
            CRITICAL_VIOLATIONS=$((CRITICAL_VIOLATIONS+1))
            VIOLATION_DETAILS="$VIOLATION_DETAILS\n🔴 CRITICAL: shell=True detected in firewall/ — Command Injection Risk (F003)"
          fi

          # Check 2: Wildcard CORS
          if grep -rn "cors_allowed_origins.*=.*['\"]\\*['\"]" --include="*.py" . 2>/dev/null | grep -v "venv\|test" | grep -q .; then
            CRITICAL_VIOLATIONS=$((CRITICAL_VIOLATIONS+1))
            VIOLATION_DETAILS="$VIOLATION_DETAILS\n🔴 CRITICAL: Wildcard CORS (Access-Control-Allow-Origin: *) — CORS violation (F005)"
          fi

          # Check 3: Hardcoded password in seed function
          if grep -rn "hashpw.*['\"].*['\"]" --include="*.py" . 2>/dev/null | grep -v "venv\|test\|environ" | grep -q .; then
            CRITICAL_VIOLATIONS=$((CRITICAL_VIOLATIONS+1))
            VIOLATION_DETAILS="$VIOLATION_DETAILS\n🔴 CRITICAL: Hardcoded password in source code (F001)"
          fi

          echo "## 🚦 Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Violations Found | $CRITICAL_VIOLATIONS |" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL_VIOLATIONS" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔴 SECURITY GATE FAILED" >> $GITHUB_STEP_SUMMARY
            echo "The following critical violations were detected:" >> $GITHUB_STEP_SUMMARY
            echo -e "$VIOLATION_DETAILS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Fix these violations before merging to main." >> $GITHUB_STEP_SUMMARY

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo " 🔴 SECURITY GATE FAILED — $CRITICAL_VIOLATIONS CRITICAL VIOLATION(S)"
            echo "═══════════════════════════════════════════════════"
            echo -e "$VIOLATION_DETAILS"
            echo ""
            echo "These critical security issues must be fixed before this"
            echo "code can be merged to the main branch."
            # Uncomment below to actually fail the CI pipeline:
            # exit 1
          else
            echo "| Gate Status | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "✅ Security gate passed — no critical violations detected."
          fi
