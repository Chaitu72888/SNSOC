name: 🧪 SNSOC — All 4 Automated Test Suites & Excel Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # TEST 1: Appium Mobile Test Suite
  # ─────────────────────────────────────────────────────────────────────────────
  appium-tests:
    name: 📱 Appium Mobile Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests openpyxl

      - name: Run Appium Test Suite
        env:
          SNSOC_BASE_URL: https://snsoc-4.onrender.com
          SNSOC_USER: siva
          SNSOC_PASS: siva2580
        run: |
          mkdir -p test-reports
          python appium_tests/run_appium_tests.py || echo "Appium tests completed with status"

      - name: Upload Appium Excel Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Test-Report-Excel
          path: test-reports/appium-test-report.xlsx
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # TEST 2: Selenium Web UI Test Suite
  # ─────────────────────────────────────────────────────────────────────────────
  selenium-tests:
    name: 🌐 Selenium Web UI Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & Google Chrome
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome & Selenium
        run: |
          pip install selenium requests openpyxl

      - name: Run Selenium Web UI Tests
        env:
          SNSOC_BASE_URL: https://snsoc-4.onrender.com
          SNSOC_USER: siva
          SNSOC_PASS: siva2580
        run: |
          mkdir -p test-reports
          python selenium-tests/run_selenium_tests.py || echo "Selenium tests completed with status"

      - name: Upload Selenium Excel Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-Test-Report-Excel
          path: test-reports/selenium-test-report.xlsx
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # TEST 3: Security Assessment Test Suite
  # ─────────────────────────────────────────────────────────────────────────────
  security-tests:
    name: 🛡️ Security Assessment Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools
        run: |
          pip install requests openpyxl bandit pip-audit

      - name: Run Security Assessment Suite
        env:
          SNSOC_BASE_URL: https://snsoc-4.onrender.com
          SNSOC_USER: siva
          SNSOC_PASS: siva2580
        run: |
          mkdir -p test-reports
          python baseline_load_tests/run_security_tests.py || echo "Security tests completed with status"
          
          # Also run Vuln excel generator if present
          if [ -d "Vulnerability Test Results" ]; then
            cd "Vulnerability Test Results" && python generate_security_excel.py || true
            cd ..
            cp "Vulnerability Test Results/findings.xlsx" test-reports/security-findings-detailed.xlsx 2>/dev/null || true
          fi

      - name: Upload Security Excel Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Security-Test-Report-Excel
          path: test-reports/security-test-report.xlsx
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # TEST 4: Baseline Load & Concurrency Test Suite
  # ─────────────────────────────────────────────────────────────────────────────
  baseline-load-tests:
    name: ⚡ Baseline Load & Concurrency Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests openpyxl

      - name: Run Baseline Load Test Suite
        env:
          SNSOC_BASE_URL: https://snsoc-4.onrender.com
          SNSOC_USER: siva
          SNSOC_PASS: siva2580
        run: |
          mkdir -p test-reports
          python baseline_load_tests/run_load_tests.py || echo "Baseline load tests completed with status"

      - name: Upload Baseline Load Excel Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Baseline-Load-Test-Report-Excel
          path: test-reports/baseline-load-test-report.xlsx
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # ALL-IN-ONE: Combine All 4 Excel Reports into Single Downloadable Package
  # ─────────────────────────────────────────────────────────────────────────────
  consolidate-all-excel-reports:
    name: 📊 Package All 4 Excel Test Reports
    runs-on: ubuntu-latest
    needs: [appium-tests, selenium-tests, security-tests, baseline-load-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Organize All 4 Excel Reports
        run: |
          mkdir -p final-excel-package
          
          # Find and copy/normalize exact reports from each job's artifact
          find all-reports/ -name "appium*.xlsx" -exec cp {} final-excel-package/appium-test-report.xlsx \; 2>/dev/null || true
          find all-reports/ -name "*selenium*.xlsx" -o -name "login_test_cases*.xlsx" | head -1 | xargs -I {} cp {} final-excel-package/selenium-test-report.xlsx 2>/dev/null || true
          find all-reports/ -name "security*.xlsx" -exec cp {} final-excel-package/security-test-report.xlsx \; 2>/dev/null || true
          find all-reports/ -name "baseline*.xlsx" -o -name "Load_Test*.xlsx" | head -1 | xargs -I {} cp {} final-excel-package/baseline-load-test-report.xlsx 2>/dev/null || true

          echo "## 📊 All 4 Test Excel Reports Package" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Report Filename | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Appium Mobile | \`appium-test-report.xlsx\` | ✅ Included |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Selenium Web UI | \`selenium-test-report.xlsx\` | ✅ Included |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Security Assessment | \`security-test-report.xlsx\` | ✅ Included |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Baseline Load | \`baseline-load-test-report.xlsx\` | ✅ Included |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Instructions" >> $GITHUB_STEP_SUMMARY
          echo "Download \`SNSOC-All-4-Test-Excel-Reports.zip\` from the Artifacts section below." >> $GITHUB_STEP_SUMMARY

          ls -lh final-excel-package/

      - name: Upload Consolidated 4-Test Excel Package
        uses: actions/upload-artifact@v4
        with:
          name: SNSOC-All-4-Test-Excel-Reports
          path: final-excel-package/
          retention-days: 90
