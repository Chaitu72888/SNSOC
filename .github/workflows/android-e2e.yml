name: Android Appium E2E Automation & Report Generation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Setup Android Environment, Run Appium Tests & Generate Reports
  android-appium-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Appium & Dependencies
        run: |
          npm install -g appium
          cd appium_mobile_tests_nodejs
          npm install

      - name: Execute Appium E2E Automation Suite & Generate Reports
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          cd appium_mobile_tests_nodejs
          node run_appium_mobile_tests.js

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-Test-Results
          path: |
            appium_mobile_tests_nodejs/Test Results/
            appium_mobile_tests_nodejs/reports/
          retention-days: 30

      - name: Setup Pages Configuration
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages Report Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'appium_mobile_tests_nodejs/reports'

      - name: Deploy Reports to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "appium_mobile_tests_nodejs/reports/latest/summary.md" ]; then
            cat "appium_mobile_tests_nodejs/reports/latest/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
