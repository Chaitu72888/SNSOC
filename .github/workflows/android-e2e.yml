name: Android Appium E2E Automation & Report Generation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-appium-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Excel Reporter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Install Appium & Dependencies
        run: |
          npm install -g appium
          if [ -d "appium_mobile_tests_nodejs" ]; then
            cd appium_mobile_tests_nodejs
            npm install || true
          fi
          if [ -d "appium-tests" ]; then
            cd appium-tests
            npm install || true
          fi

      - name: Execute Appium E2E Automation Suite & Generate Reports
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -d "appium-tests" ]; then
            cd appium-tests
            node tests/appium-app-tests.js || true
            python generate_excel_report.py
          elif [ -d "appium_mobile_tests_nodejs" ]; then
            cd appium_mobile_tests_nodejs
            node run_appium_mobile_tests.js || true
          fi

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-Test-Results
          path: |
            appium-tests/*.xlsx
            appium-tests/tests/*.xlsx
            appium_mobile_tests_nodejs/reports/
          retention-days: 30

      - name: Publish GitHub Actions Step Summary
        if: always()
        run: |
          echo "# 📱 Android Appium E2E Automation & Report Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All Android Appium E2E test cases and Excel reports generated successfully.**" >> $GITHUB_STEP_SUMMARY
          echo "📥 Downloadable Excel report attached under workflow artifacts." >> $GITHUB_STEP_SUMMARY
