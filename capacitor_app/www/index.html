<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNSOC Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 36px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-box {
            width: 48px;
            height: 48px;
            background: #3b82f6;
            border-radius: 10px;
            margin: 0 auto 16px auto;
        }
        h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .highlight { color: #3b82f6; }
        p { font-size: 0.9rem; color: #9ca3af; line-height: 1.5; margin-bottom: 24px; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .status-text {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box"></div>
        <h2>SNSOC<span class="highlight">.live</span></h2>
        <p id="statusMsg">Connecting to Security Operations Center...</p>
        <div class="spinner" id="loader"></div>
        <button class="btn" id="retryBtn" style="display:none;" onclick="connectToSOC()">Retry Connection</button>
        <div class="status-text" id="subText">Initializing network connection...</div>
    </div>

    <script>
        const SERVER_URL = "https://snsoc-4.onrender.com";
        let attempts = 0;

        async function connectToSOC() {
            attempts++;
            const statusMsg = document.getElementById('statusMsg');
            const subText = document.getElementById('subText');
            const loader = document.getElementById('loader');
            const retryBtn = document.getElementById('retryBtn');

            statusMsg.textContent = "Connecting to Security Operations Center...";
            subText.textContent = `Attempt ${attempts} • Connecting to server...`;
            loader.style.display = 'block';
            retryBtn.style.display = 'none';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);
                
                const response = await fetch(`${SERVER_URL}/api/ping`, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    statusMsg.textContent = "Connected! Loading SOC Dashboard...";
                    window.location.href = `${SERVER_URL}/auth/login`;
                    return;
                }
            } catch (err) {
                console.warn("[SOC Connection Retry]", err);
            }

            if (attempts < 6) {
                setTimeout(connectToSOC, 2500);
            } else {
                loader.style.display = 'none';
                retryBtn.style.display = 'block';
                statusMsg.textContent = "Unable to connect to SNSOC server.";
                subText.textContent = "Please check your mobile data / Wi-Fi connection and tap Retry below.";
            }
        }

        window.addEventListener('DOMContentLoaded', connectToSOC);
    </script>
</body>
</html>
