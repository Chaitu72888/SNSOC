<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNSOC.live — Forgot Passcode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5.0">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background-color: var(--accent-blue);
            border-radius: 6px;
        }

        .logo h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .highlight {
            color: var(--accent-blue);
        }

        .page-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .page-desc {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .styled-input {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .styled-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .styled-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, opacity 0.2s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .styled-btn:hover {
            background-color: #2563eb;
        }

        .styled-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .alert-box {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon"></div>
            <h2>SNSOC<span class="highlight">.live</span></h2>
        </div>

        <div class="page-title">Reset Your Passcode</div>
        <div class="page-desc">Enter your registered Operator Name (email) and we'll send you a passcode reset link.</div>

        <div id="banner-container">
            {% if error %}
            <div class="alert-box alert-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert-box alert-success">{{ success }}</div>
            {% endif %}
        </div>

        <form id="forgotForm" method="POST" action="/auth/forgot-password" onsubmit="handleForgotSubmit(event)">
            <div class="form-group">
                <label for="username">Operator Name (Email)</label>
                <input type="email" id="username" name="username" class="styled-input" placeholder="operator@snsoc.live" required autofocus>
            </div>

            <button type="submit" id="submitBtn" class="styled-btn">
                <span id="btnText">Send Reset Link</span>
                <span id="btnSpinner" class="spinner" style="display:none;"></span>
            </button>
        </form>

        <div class="footer-link">
            Remember your passcode? <a href="{{ url_for('auth.login') }}">Sign In</a>
        </div>
    </div>

    <script>
        async function handleForgotSubmit(e) {
            e.preventDefault();
            const emailInput = document.getElementById('username');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            const emailVal = emailInput.value.trim();
            if (!emailVal) return;

            submitBtn.disabled = true;
            btnText.textContent = 'Sending...';
            btnSpinner.style.display = 'inline-block';

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: emailVal })
                });

                const data = await response.json();
                const container = document.getElementById('banner-container');

                if (response.ok && data.status === 'success') {
                    container.innerHTML = `<div class="alert-box alert-success">${data.message || 'If an account exists with that email, a passcode reset link has been sent.'}</div>`;
                } else {
                    container.innerHTML = `<div class="alert-box alert-error">${data.error || 'Failed to send reset link'}</div>`;
                }
            } catch (err) {
                document.getElementById('banner-container').innerHTML = `<div class="alert-box alert-error">Network error. Please try again.</div>`;
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Send Reset Link';
                btnSpinner.style.display = 'none';
            }
        }
    </script>
</body>

</html>
